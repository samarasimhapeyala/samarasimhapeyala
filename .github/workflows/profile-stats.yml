name: Update profile stats

on:
  schedule:
    - cron: "0 3 * * *"      # daily
  workflow_dispatch:          # run manually from the Actions tab
  push:
    paths:
      - scripts/generate-stats.js
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate stats cards
        run: node scripts/generate-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: samarasimhapeyala
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
